<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Reactor</title>
  <desc id="desc">A reactor and scheduler mark with golden-ratio energy arcs surrounding a radiation-inspired AI core.</desc>

  <defs>
    <!-- One scheduler tick, repeated evenly around the containment ring. -->
    <rect id="tick" x="250" y="67" width="12" height="23" rx="6"/>

  </defs>

  <!-- Labb32 warm-ivory field. -->
  <rect width="512" height="512" rx="76" fill="#EEE4CF"/>

  <!-- Twelve evenly spaced scheduler marks. -->
  <g fill="#183B63">
    <use href="#tick"/>
    <use href="#tick" transform="rotate(30 256 256)"/>
    <use href="#tick" transform="rotate(60 256 256)"/>
    <use href="#tick" transform="rotate(90 256 256)"/>
    <use href="#tick" transform="rotate(120 256 256)"/>
    <use href="#tick" transform="rotate(150 256 256)"/>
    <use href="#tick" transform="rotate(180 256 256)"/>
    <use href="#tick" transform="rotate(210 256 256)"/>
    <use href="#tick" transform="rotate(240 256 256)"/>
    <use href="#tick" transform="rotate(270 256 256)"/>
    <use href="#tick" transform="rotate(300 256 256)"/>
    <use href="#tick" transform="rotate(330 256 256)"/>
  </g>

  <!-- Arc lengths 137.5 : 222.5 : 360 approximate 1 : phi : phi squared. -->
  <g fill="none" stroke-width="34" stroke-linecap="round" transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="142" stroke="#C89A2B" stroke-dasharray="137.5 754.7" stroke-dashoffset="0"/>
    <circle cx="256" cy="256" r="142" stroke="#B84436" stroke-dasharray="222.5 669.7" stroke-dashoffset="-194.9"/>
    <circle cx="256" cy="256" r="142" stroke="#34715E" stroke-dasharray="360 532.2" stroke-dashoffset="-474.8"/>
  </g>

  <!-- Reactor containment boundary. -->
  <circle cx="256" cy="256" r="108" fill="#EEE4CF" stroke="#183B63" stroke-width="12"/>

  <!-- Radiation-inspired AI core, derived from the Labb32 AI mark. -->
  <g transform="translate(256 256) scale(.53) translate(-256 -256)">
    <g stroke="#EEE4CF" stroke-width="14" stroke-linejoin="round">
      <path fill="#C89A2B" d="M256 74C202 74 156 107 134 157L219 206C228 186 240 175 256 171C272 175 284 186 293 206L378 157C356 107 310 74 256 74Z"/>
      <path fill="#B84436" d="M413 346C440 299 435 242 405 199L320 248C332 267 333 284 326 299C315 311 300 319 279 319L279 417C329 418 377 393 413 346Z"/>
      <path fill="#34715E" d="M99 346C72 299 77 242 107 199L192 248C180 267 179 284 186 299C197 311 212 319 233 319L233 417C183 418 135 393 99 346Z"/>
    </g>

    <!-- All nested chip squares share the exact center point (256, 256). -->
    <g transform="rotate(45 256 256)">
      <rect x="191" y="191" width="130" height="130" rx="12" fill="#183B63"/>
      <rect x="216" y="216" width="80" height="80" rx="6" fill="#EEE4CF"/>
      <rect x="235" y="235" width="42" height="42" rx="4" fill="#183B63"/>
      <g fill="none" stroke="#183B63" stroke-width="10" stroke-linecap="square">
        <path d="M256 205V224"/>
        <path d="M307 256H288"/>
        <path d="M256 307V288"/>
        <path d="M205 256H224"/>
      </g>
    </g>
    <circle cx="256" cy="256" r="8" fill="#C89A2B"/>
  </g>
</svg>
