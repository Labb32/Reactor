[package]
name = "reactor"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
jiff = "0.2.37"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
